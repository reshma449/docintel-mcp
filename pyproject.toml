[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "docintel-mcp"
version = "0.1.0"
description = "Document Intelligence MCP server: OCR/text extraction, confidence-threshold routing, human review queues, and document search over the Model Context Protocol."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Reshma Asha Gurajala Rajendranaidu" }]
keywords = ["mcp", "model-context-protocol", "document-intelligence", "ocr", "llm", "human-in-the-loop"]
dependencies = [
    "mcp>=1.2.0",
    "pypdf>=4.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]

[project.scripts]
docintel-mcp = "docintel_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/docintel_mcp"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
